services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: axiom-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - qdrant
      - redis
      - timescaledb
      - ollama
    volumes:
      - ./:/app
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: axiom-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/axiom_neo4j_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: axiom-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: axiom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: axiom-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom_timescale_password
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.6
    container_name: axiom-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  redis_data:
  timescaledb_data:
  ollama_data:
