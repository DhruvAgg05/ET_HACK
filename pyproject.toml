[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "axiom-platform"
version = "0.1.0"
description = "AXIOM: Asset and eXpert Intelligence for Operations and Maintenance."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "Proprietary" }
authors = [
  { name = "AXIOM Engineering" }
]
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "structlog==25.4.0",
  "httpx==0.28.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "aiofiles==24.1.0",
  "orjson==3.10.18",
  "tenacity==9.1.2",
  "neo4j==5.28.1",
  "qdrant-client==1.15.0",
  "redis[hiredis]==5.2.1",
  "celery[redis]==5.5.3",
  "langchain==0.3.27",
  "langchain-core==0.3.72",
  "langchain-community==0.3.27",
  "langchain-text-splitters==0.3.9",
  "langchain-ollama==0.3.6",
  "langchain-openai==0.3.28",
  "langgraph==0.2.74",
  "sentence-transformers==3.4.1",
  "pymupdf==1.26.3",
  "camelot-py[cv]==0.11.0",
  "pytesseract==0.3.13",
  "Pillow==11.3.0",
  "opencv-python-headless==4.10.0.84",
  "spacy==3.8.7",
  "gliner==0.2.16",
  "python-docx==1.1.2",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "numpy==1.26.4",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "rank-bm25==0.2.2",
  "rapidfuzz==3.13.0",
  "networkx==3.4.2",
  "email-validator==2.2.0",
  "typing-extensions==4.14.1",
  "tiktoken==0.9.0"
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "mypy==1.16.1",
  "pre-commit==4.2.0",
  "pytest==8.4.1",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.4"
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "C4",
  "SIM",
  "N",
  "ASYNC",
  "RUF"
]
ignore = [
  "B008"
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = []
files = ["backend", "scripts", "tests"]
exclude = [
  "^frontend/",
  "^data/"
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
